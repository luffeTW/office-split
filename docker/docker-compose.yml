version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: debtapp-postgres
    environment:
      POSTGRES_DB: debtapp
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - debtapp-network

  backend:
    build:
      context: ..
      dockerfile: docker/Dockerfile.backend
    container_name: debtapp-backend
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:5000
      - ConnectionStrings__DefaultConnection=Host=postgres;Database=debtapp;Username=postgres;Password=postgres
      - Jwt__Key=YourSuperSecretKeyThatShouldBeAtLeast32CharactersLong!
      - Jwt__Issuer=DebtApp
      - Jwt__Audience=DebtAppUsers
      - Jwt__ExpiryMinutes=1440
    ports:
      - "5000:5000"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - debtapp-network

  frontend:
    build:
      context: ..
      dockerfile: docker/Dockerfile.frontend
    container_name: debtapp-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    networks:
      - debtapp-network

volumes:
  postgres_data:

networks:
  debtapp-network:
    driver: bridge
